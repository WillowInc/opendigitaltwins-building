name: Merge DTDL

on:
  workflow_dispatch:
  push:
    branches: 
      - "main"
    paths:
      - "Ontology/Willow/**"

# Only one publish run at a time; a newer ontology push cancels an in-flight
# older run so a stale regeneration can't force-push over a newer one on the
# shared publish branch.
concurrency:
  group: merge-dtdl-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        token:  ${{ secrets.GITHUB_TOKEN }}
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x
    - name: Build DTDL Merger
      run: dotnet build Tools/DTDLMerger/DTDLMerger.csproj
    - name: Run DTDL Merger on Willow Ontology DTDLv3
      run: dotnet run --project Tools/DTDLMerger/DTDLMerger.csproj Ontology/Willow/ > Metadata/Willow.Ontology.DTDLv3.jsonld
    - name: Set .nuspec version
      id: set-version
      uses: vers-one/dotnet-project-version-updater@v1.8
      with:
        files: "Metadata/*.nuspec"
        version: bump-revision
    - name: Commit regenerated artifact and open/update publish PR
      run: |
        git config user.email "admin@willowinc.com"
        git config user.name "Auto Generated"
        # Publish only when the GENERATED ontology actually changed. The nuspec
        # version bump (previous step) happens on every run, so check the jsonld
        # independently -- otherwise a manual rerun or a comment-only source edit
        # would open a version-only publish PR.
        if git diff --quiet HEAD -- Metadata/Willow.Ontology.DTDLv3.jsonld; then
          echo "No ontology changes to publish."
          exit 0
        fi
        # Stable branch name, force-pushed each run. A version-derived branch
        # name collides with its own stranded PR when main's version has not
        # advanced, which wedged this pipeline for ~3 months (the push was
        # rejected with 'fetch first'). A stable force-pushed branch cannot
        # deadlock; workflow concurrency (above) keeps overlapping runs from
        # racing on it.
        BRANCH="auto/ontology-republish"
        git checkout -B "$BRANCH"
        git add Metadata/Willow.Ontology.DTDLv3.jsonld Metadata/Willow.Ontology.DTDLv3.nuspec
        git commit -m "Set .nuspec version to ${{ steps.set-version.outputs.newVersion }}"
        git push --force --set-upstream origin "$BRANCH"
        PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
        if [ -z "$PR" ]; then
          PR=$(gh pr create --head "$BRANCH" --base main \
            --title "Publish ontology artifact ${{ steps.set-version.outputs.newVersion }}" \
            --body "Automated regeneration of the merged DTDLv3 ontology artifact from Ontology/Willow source." \
            | grep -oE '[0-9]+$')
        fi
        # Best-effort auto-merge. Never fail the run if the merge cannot
        # complete, so a blocked merge leaves a mergeable PR open instead of
        # deadlocking every subsequent run.
        gh pr merge "$PR" --merge --delete-branch \
          || echo "::warning::Auto-merge of PR #$PR did not complete; left open for manual merge."
