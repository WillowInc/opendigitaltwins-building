name: Manually set .nuspec version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New .nuspec version"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  manually-set-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set .nuspec version
        id: set-version
        uses: vers-one/dotnet-project-version-updater@v1.8
        with:
          files: "Metadata/*.nuspec"
          version: ${{ github.event.inputs.version }}
      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/${{ steps.set-version.outputs.newVersion }}
          commit-message: Set .nuspec version to ${{ steps.set-version.outputs.newVersion }}
          title: Set .nuspec version to ${{ steps.set-version.outputs.newVersion }}
          body: Automated .nuspec version bump to ${{ steps.set-version.outputs.newVersion }}.
          draft: false
